# Конфигурация анализа Tessera для SonarQube Community Build (#2937).
# Запуск: make sonar-scan (стенд поднимается через make sonar-up).
#
# Один проект на всё монорепо, а не проект на компонент: Community Build не
# умеет портфели, и пять отдельных проектов пришлось бы сводить глазами.
sonar.projectKey=tessera
sonar.projectName=Tessera
sonar.projectVersion=develop

# Исходники перечислены поимённо, а не «.»: иначе в анализ уедут node_modules,
# сборочные каталоги и 76 ГБ артефактов, которых в репозитории нет.
sonar.sources=\
  backend,\
  frontend/src,\
  android/app/src/main,\
  desktop/src-tauri/src,\
  mcp,\
  converter,\
  tools

sonar.tests=\
  frontend/tests,\
  frontend/e2e,\
  android/app/src/test,\
  android/app/src/androidTest

# Go-тесты лежат рядом с кодом, отдельным каталогом их не выделить —
# Sonar узнаёт их по суффиксу файла.
sonar.test.inclusions=**/*_test.go,**/*.spec.js,**/*.spec.ts,**/*.test.js,**/*.test.ts

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/*.min.js,\
  backend/db/**,\
  frontend/src/locales/**

# backend/db/** — целиком вывод sqlc (`make sqlc`), править его руками нельзя;
# замечания Sonar там — это замечания к генератору, а не к нам.

sonar.sourceEncoding=UTF-8

# ── Импорт покрытия ────────────────────────────────────────
# Пути проставляются только если файлы существуют — см. tools/sonar-scan.sh.
# Отчёты генерятся make test-backend-cover / test-frontend-cover /
# test-android-cover; без них анализ просто пройдёт без метрики покрытия.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
