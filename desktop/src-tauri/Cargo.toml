[package]
name = "tessera-desktop"
version = "0.2.1"
description = "Tessera desktop app"
authors = ["msdnna"]
edition = "2021"
rust-version = "1.77.2"

# The app logic lives in a lib so it can be shared; main.rs is a thin shim. This
# is the layout `cargo tauri` scaffolds and expects.
[lib]
name = "tessera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the webview inspector available in release builds (right-click →
# Inspect) — handy while the desktop app is stabilising; drop it for a locked release.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile: smaller, faster binaries for the shipped installers.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
