[package]
name = "tessera-desktop"
version = "0.3.4"
description = "Tessera desktop app"
authors = ["msdnna"]
edition = "2021"
rust-version = "1.77.2"

# The app logic lives in a lib so it can be shared; main.rs is a thin shim. This
# is the layout `cargo tauri` scaffolds and expects.
[lib]
name = "tessera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the webview inspector available in release builds (right-click →
# Inspect) — handy while the desktop app is stabilising; drop it for a locked release.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# GitLab OAuth (#2696): the login opens in the *system* browser (opener) and the session
# comes back on the tessera:// custom scheme (deep-link). Doing it inside our own webview
# is the bug this replaces, and RFC 8252 forbids it besides.
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native webview handles for the media/permission wiring in src/media.rs (#2929).
# These MUST stay pinned to exactly what wry 0.55 links against: `with_webview` hands
# back `webkit2gtk::WebView` / `ICoreWebView2Controller` from *that* crate version, and
# the same type from a different version is a different type — a mismatch is a compile
# error, not a runtime surprise. Bump them together with tauri/wry.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation"] }

# Release profile: smaller, faster binaries for the shipped installers.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
