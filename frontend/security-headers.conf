# Security headers for everything this origin serves itself (#2932).
#
# A separate file rather than four add_header lines in nginx.conf, because they
# have to be repeated: add_header is NOT additive across levels — a location
# that declares any add_header of its own drops every header inherited from
# server{}. Four locations here set Cache-Control for the PWA shell (#2748), so
# the one page an attacker would most want in a frame — index.html — is exactly
# the one that would lose the guard if this were declared once at the top.
# Keeping the set in one file makes the repetition a single include line and the
# omission visible; tests/nginxSecurityHeaders.spec.js fails if a location that
# sets a header of its own forgets it.
#
# Copied to /etc/nginx/ by frontend/Dockerfile, alongside conf.d/default.conf.
#
# `always` on each: without it nginx skips the header on error responses, and
# 413 (upload over client_max_body_size) and the SPA's own 404s are served from
# this origin like any other page.

# No framing, from anywhere. The app embeds no iframe of its own — the recorder
# template at /rec/egress is opened top-level by the egress browser, and the
# desktop client loads the server in a Tauri webview, which is a top-level
# navigation too — so DENY costs nothing here. Both spellings: frame-ancestors
# is the one browsers honour, X-Frame-Options covers anything older.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# Pin the declared type. The backend already does this on the routes that hand
# out user-supplied bytes; this covers the static bundle and the /apks/ and
# /desktop/ self-update stores, which are served straight off disk.
add_header X-Content-Type-Options "nosniff" always;

# The SPA keeps workspace and task ids in the URL, and it links out to GitLab
# with target="_blank". Send the origin instead of the full path cross-site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
