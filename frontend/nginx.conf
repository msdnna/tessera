server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + WebSocket proxied to the backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket upgrade (/api/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Android self-update store (bind-mounted from repo ./apks). Served as plain
    # files — a missing APK 404s instead of falling through to the SPA index.
    location /apks/ {
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
