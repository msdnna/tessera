# Map the Upgrade header to the right Connection value: "upgrade" for a WebSocket
# handshake, empty otherwise. An empty Connection (instead of a literal "upgrade"
# on every request) is what lets nginx keep upstream connections alive — so a
# board's burst of ~10 API calls reuses pooled connections instead of paying a
# fresh TCP + handshake each (a big part of the "first wave is slow" the remote
# install shows). Declared at http context (conf.d is included inside http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Honour an outer TLS-terminating proxy's X-Forwarded-* when it set them. On the
# dev edge (and any HTTPS reverse proxy in front of this container) the chain is
# browser →(https) Caddy →(http) this nginx → backend, so nginx's own $scheme is
# 'http'. Overwriting the header with $scheme made the backend build http://
# absolute URLs on an https site — the GitLab OAuth callback came back to
# http://host:8443 and failed with "HTTP request to an HTTPS server" (#2922).
# Fall back to the local value when nothing sits in front (the plain :8083 http
# frontend), so single-proxy deploys are unchanged.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# Keep-alive pool to the backend, so proxied /api requests reuse connections.
upstream tessera_backend {
    server backend:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# LiveKit SFU signalling for conferences (#2864, #2866). resolve at request time
# is deliberate: nginx resolves an upstream{} host once at startup and refuses to
# start if it is missing, which would make a stack without the conferences
# service unable to serve the SPA at all. A variable in proxy_pass defers the
# lookup, so /livekit/ 502s while everything else keeps working.
resolver 127.0.0.11 ipv6=off valid=30s;

# nginx 1.27's stock mime.types maps only .js, so a .mjs asset falls through to
# default_type application/octet-stream and the browser refuses to execute it as
# a module — the pdf.js worker (assets/pdf.worker.min-*.mjs) dies with "Failed to
# fetch dynamically imported module" (#2752). conf.d is included inside http,
# after mime.types, so this block tops up the inherited types hash. Declaring it
# inside server{} instead would replace that hash wholesale and turn css/images
# into octet-stream too.
types {
    application/javascript mjs;
}

# Compress text responses. The backend already gzips its own JSON (nginx passes
# an already-encoded upstream response through untouched), but this covers the
# SPA's own JS/CSS/HTML that nginx serves directly, and any /api response that
# reaches here uncompressed.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/x-javascript
    text/css
    text/javascript
    text/plain
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow attachment / avatar / inline-image uploads through the /api proxy.
    # Without this nginx's 1m default would 413 anything larger.
    client_max_body_size 50m;

    # API + WebSocket proxied to the backend container.
    location /api/ {
        proxy_pass http://tessera_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the public origin (host:port + scheme) so the backend can build
        # correct absolute URLs (e.g. the GitLab OAuth redirect_uri) behind the
        # proxy. $host drops the port; $http_host keeps it. The mapped variables
        # keep an outer HTTPS proxy's scheme/host instead of clobbering them with
        # this hop's plain-http values (#2922).
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # WebSocket upgrade (/api/ws); the mapped Connection also enables upstream
        # keep-alive for ordinary requests (empty Connection on non-upgrade calls).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long read timeout carries idle WebSocket connections; send timeout keeps a
        # slow or quiet upstream from being cut at nginx's 60s default. (Buffering
        # is left at its default — nginx tunnels the connection after the 101
        # upgrade, so WebSocket streaming is unaffected.)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # LiveKit signalling (#2866). In production Caddy handles /livekit/* and this
    # location never sees a request; it is what makes the same URL work on the
    # docker frontend at :8083, so dev and prod share one client-side path.
    #
    # The rewrite is not optional: livekit-client appends /rtc (and /rtc/v1) to
    # its base URL, so the SFU must receive /rtc/v1, not /livekit/rtc/v1. And the
    # prefix cannot be stripped by putting a URI in proxy_pass here — with a
    # variable in proxy_pass nginx skips the usual prefix replacement and passes
    # the request URI through unchanged.
    location /livekit/ {
        set $livekit_upstream livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://$livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Signalling stays open for the whole call; nginx's 60s default would cut
        # a quiet meeting loose and drop everyone mid-conversation.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Android self-update store (bind-mounted from repo ./apks). Served as plain
    # files — a missing APK 404s instead of falling through to the SPA index.
    location /apks/ {
        try_files $uri =404;
    }

    # Desktop (Tauri) self-update store (bind-mounted from ./desktop-dist). Serves
    # the updater manifest + bundles; a missing file 404s instead of the SPA index.
    location /desktop/ {
        try_files $uri =404;
    }

    # PWA update mechanism (#2748): the service worker, its registration shim and
    # the app shell must never be cached, or a browser keeps running the old SW /
    # HTML and never notices a new deploy. The hashed JS/CSS they pull in are
    # immutable and cache freely under the defaults.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
