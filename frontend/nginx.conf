# Map the Upgrade header to the right Connection value: "upgrade" for a WebSocket
# handshake, empty otherwise. An empty Connection (instead of a literal "upgrade"
# on every request) is what lets nginx keep upstream connections alive — so a
# board's burst of ~10 API calls reuses pooled connections instead of paying a
# fresh TCP + handshake each (a big part of the "first wave is slow" the remote
# install shows). Declared at http context (conf.d is included inside http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Keep-alive pool to the backend, so proxied /api requests reuse connections.
upstream tessera_backend {
    server backend:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Compress text responses. The backend already gzips its own JSON (nginx passes
# an already-encoded upstream response through untouched), but this covers the
# SPA's own JS/CSS/HTML that nginx serves directly, and any /api response that
# reaches here uncompressed.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/x-javascript
    text/css
    text/javascript
    text/plain
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow attachment / avatar / inline-image uploads through the /api proxy.
    # Without this nginx's 1m default would 413 anything larger.
    client_max_body_size 50m;

    # API + WebSocket proxied to the backend container.
    location /api/ {
        proxy_pass http://tessera_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the public origin (host:port + scheme) so the backend can build
        # correct absolute URLs (e.g. the GitLab OAuth redirect_uri) behind the
        # proxy. $host drops the port; $http_host keeps it.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (/api/ws); the mapped Connection also enables upstream
        # keep-alive for ordinary requests (empty Connection on non-upgrade calls).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long read timeout carries idle WebSocket connections; send timeout keeps a
        # slow or quiet upstream from being cut at nginx's 60s default. (Buffering
        # is left at its default — nginx tunnels the connection after the 101
        # upgrade, so WebSocket streaming is unaffected.)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Android self-update store (bind-mounted from repo ./apks). Served as plain
    # files — a missing APK 404s instead of falling through to the SPA index.
    location /apks/ {
        try_files $uri =404;
    }

    # Desktop (Tauri) self-update store (bind-mounted from ./desktop-dist). Serves
    # the updater manifest + bundles; a missing file 404s instead of the SPA index.
    location /desktop/ {
        try_files $uri =404;
    }

    # PWA update mechanism (#2748): the service worker, its registration shim and
    # the app shell must never be cached, or a browser keeps running the old SW /
    # HTML and never notices a new deploy. The hashed JS/CSS they pull in are
    # immutable and cache freely under the defaults.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
