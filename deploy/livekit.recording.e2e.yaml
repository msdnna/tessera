# LiveKit SFU for the recording stand (#2877). Sibling of livekit.e2e.yaml, which
# serves the web suite's media tier — every peculiarity documented there (TCP-only
# ICE, node_ip: 127.0.0.1, auto_create off, and why the port pair sometimes has to
# move) applies here unchanged. Only two things differ, and both follow from the
# stand being a *second* SFU on the same box:
#
#   • ports are 7955/7956, so this can run beside a live conferences.spec.js tier;
#   • redis is not here — it comes from REDIS_HOST in deploy/recording.e2e.yml,
#     which is what puts the server in the multi-node mode where an egress store
#     exists at all. Keeping it out of the file means this config is inert on its
#     own and cannot flip an SFU's mode by being mounted somewhere by mistake.
#
# THE PORTS MUST BE PUBLISHED ONE-TO-ONE (7955:7955, 7956:7956), which is why this
# file exists instead of a `-p 7955:7945` mapping over the sibling. node_ip is
# loopback, so the ICE candidate the browser receives names the *container's* port
# number against 127.0.0.1 on the host. Under a shifted mapping that candidate
# points at whatever else holds the container-side number — on this box, the other
# e2e SFU — and the call fails in the least legible way available: signalling
# connects, the participant appears, and no media ever arrives.
#
# Same no-secrets rule as its siblings: the key/secret come from LIVEKIT_KEYS.

port: 7955

rtc:
  tcp_port: 7956
  udp_port: 0
  port_range_start: 0
  port_range_end: 0
  use_external_ip: false
  node_ip: 127.0.0.1

room:
  auto_create: false
  max_participants: 30
  empty_timeout: 300
  departure_timeout: 20

logging:
  # info, like the sibling: "participant active" and the egress lifecycle lines
  # are how you tell a real recording from a stand that merely started.
  level: info
  pion_level: error
