# Throwaway recording stand for #2877 — the live half of the conference-recording
# feature, which unit tests structurally cannot reach: everything below the
# backend's HTTP layer (Redis dispatch, a headless Chrome joining the room, the
# mp4 landing in a directory two containers share) only exists when the real
# containers run.
#
# NOT the production stack and not `make up`. Production is docker-compose.yml,
# whose `recording` profile carries the same three services against the real SFU;
# this file is a sealed copy on shifted ports with its own project name, so it can
# run beside both without touching either. Start it with:
#
#   make recording-e2e-up            # then `make recording-e2e-down`
#
# WHY A SEPARATE FILE RATHER THAN THE `recording` PROFILE. Turning that profile on
# means setting LIVEKIT_REDIS_HOST on the *production* SFU, which switches it to
# multi-node mode mid-flight — i.e. an e2e run would change how live conferences
# store their state. The whole point of the profile is that it is a deliberate,
# per-deployment decision; borrowing it for a test would make that decision by
# accident.
#
# WHAT IS FAITHFUL TO PRODUCTION AND WHAT IS NOT, because a green run is only
# worth what it shares with the real thing:
#
#   faithful — the egress image and its config file (deploy/egress.yaml, mounted
#     verbatim), Chrome sandboxing with the widened seccomp profile, the Redis
#     dispatch path, and the uid/gid arrangement on the recordings directory
#     (owner = the backend, group 0, setgid) that lets two containers with no
#     shared identity write into one folder;
#   not faithful — ports, ICE (TCP only, see livekit.e2e.yaml), and the uploads
#     directory, which is a host bind here instead of a named volume so the
#     throwaway backend from `make e2e-backend-up` — a plain host process — can
#     read the finished mp4 back.
name: tessera-recording-e2e

services:
  # The only channel between livekit-server and egress. Not published: only the
  # two containers below ever talk to it.
  redis:
    image: redis:7-alpine
    container_name: tessera-recording-e2e-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # deploy/livekit.recording.e2e.yaml — the throwaway SFU of the web suite's media
  # tier on a second port pair, so both can run at once. Recording adds exactly one
  # thing to that config: REDIS_HOST, which is what puts the server into the
  # multi-node mode where an egress store exists at all.
  #
  # The publishes are one-to-one on purpose and must stay that way: node_ip is
  # loopback, so the ICE candidate handed to the browser carries the container's
  # own port number. Read the header of that config before changing either number.
  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: tessera-recording-e2e-livekit
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_KEYS: "${REC_E2E_KEY:?set REC_E2E_KEY}: ${REC_E2E_SECRET:?set REC_E2E_SECRET}"
      REDIS_HOST: redis:6379
    ports:
      - "${REC_E2E_PORT:?set REC_E2E_PORT}:${REC_E2E_PORT:?set REC_E2E_PORT}"
      - "${REC_E2E_RTC_PORT:?set REC_E2E_RTC_PORT}:${REC_E2E_RTC_PORT:?set REC_E2E_RTC_PORT}"
    volumes:
      - ./livekit.recording.e2e.yaml:/etc/livekit.yaml:ro

  # Gives the bind-mounted uploads directory the ownership production's
  # `egress-init` gives the named volume, and for the same reason: the backend
  # (here, a host process running as the invoking user) creates the per-conference
  # folder and deletes files, egress (uid 1001, gid 0) writes the mp4 into it, and
  # neither can take the other's identity. They meet on group 0, and setgid is
  # what carries that group one level down to the folder the backend creates.
  #
  # It runs as root inside the container on purpose — that is the only identity
  # here that can chown a host directory, and it is also the one thing this stand
  # does that the host user could not do unaided.
  rec-init:
    image: alpine:3.21
    container_name: tessera-recording-e2e-init
    restart: "no"
    command:
      - sh
      - -c
      - mkdir -p /data/uploads/rec && chown ${REC_E2E_UID:?set REC_E2E_UID}:0 /data/uploads/rec && chmod 2775 /data/uploads/rec
    volumes:
      - ${REC_E2E_UPLOAD_DIR:?set REC_E2E_UPLOAD_DIR}:/data/uploads

  # network_mode: service:livekit — egress shares the SFU's network namespace
  # rather than sitting next to it. This is not an optimisation; livekit.e2e.yaml
  # advertises node_ip: 127.0.0.1, so 127.0.0.1 is the only address of that SFU
  # anyone can reach. From its own namespace a sibling container would resolve the
  # signalling URL fine and then find no route for the ICE candidate — a failure
  # that looks like "the recording starts and produces nothing".
  #
  # Sharing the namespace keeps DNS from the compose network, so `redis:6379` in
  # deploy/egress.yaml resolves here exactly as it does in production, and the
  # config file needs no e2e variant.
  #
  # The uploads bind is mounted at the SAME absolute path the backend uses, so
  # LIVEKIT_EGRESS_UPLOAD_DIR is unnecessary: both sides name the file identically
  # and a path mismatch cannot hide behind a rewrite that happens to agree.
  egress:
    image: livekit/egress:v1.14.1
    container_name: tessera-recording-e2e-egress
    depends_on:
      redis:
        condition: service_healthy
      rec-init:
        condition: service_completed_successfully
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: "${REC_E2E_KEY:?set REC_E2E_KEY}"
      LIVEKIT_API_SECRET: "${REC_E2E_SECRET:?set REC_E2E_SECRET}"
      LIVEKIT_WS_URL: "ws://127.0.0.1:${REC_E2E_PORT:?set REC_E2E_PORT}"
    security_opt:
      - seccomp:./chrome-sandboxing-seccomp-profile.json
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ${REC_E2E_UPLOAD_DIR:?set REC_E2E_UPLOAD_DIR}:${REC_E2E_UPLOAD_DIR:?set REC_E2E_UPLOAD_DIR}
