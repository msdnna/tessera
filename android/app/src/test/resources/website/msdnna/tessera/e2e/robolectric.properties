# Robolectric's default device is 320x470px, which is smaller than the app's own
# login form: the mode toggle laid out below the fold, and taps aimed at it (or at
# the server popover) landed outside the window and were silently dropped — the
# specs failed on geometry, not on behaviour. A Pixel-class screen is both bigger
# than any screen the app actually ships on and the size the layout was designed
# for, so specs assert the app rather than the emulated device.
#
# The `ru` locale pins the resource language to the app's canon (values/). The e2e
# harness mounts screens directly, without the AppLocale wrapper, so string
# resources resolve against Robolectric's locale — which defaults to the JVM's, and
# on a CI runner that is en_US. Once values-en/ existed (#2803/#2809) an empty-state
# assertion like «Документ пуст» resolved to the English string and the spec timed
# out. Pinning ru makes the suite deterministic and matches the Russian fixture data
# the other assertions already rely on.
qualifiers=ru-w411dp-h891dp-xhdpi
