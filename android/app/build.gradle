plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.gitlab.arturbosch.detekt'
    id 'jacoco'
}

// Background push (FCM) is opt-in per build: the google-services plugin hard-fails
// the build when its config file is missing, and google-services.json is tied to a
// specific Firebase project so it stays out of the repo. Without the file the app
// still builds and runs — device notifications just stay on the live-socket path,
// which is also what a degoogled phone gets.
def hasFirebaseConfig = file("google-services.json").exists()
if (hasFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
}

def appVersionName = rootProject.file("VERSION").text.trim()
def (vmaj, vmin, vpatch) = appVersionName.tokenize('.').collect { it.toInteger() }
def appVersionCode = vmaj * 10000 + vmin * 100 + vpatch

// ── Help centre content (#2795) ──────────────────────────────────────────────
// The manual has one source — `docs/help` — and the web bundles it from there.
// The APK gets the same files copied in at build time instead of a second copy
// in git: two copies drift, and the drift is invisible (the app would keep
// showing last month's text with nothing red anywhere). The index (navigation,
// per-article TOC, search corpus) is the JSON the web build already commits.
//
// Wired through the variant API rather than `sourceSets.assets.srcDir(task)`:
// AGP 9 rejects a Provider there outright, and a bare path would be merged
// before the copy had run.
def helpDocsDir = rootProject.file("../docs/help")
def helpIndexJson = rootProject.file("../frontend/src/data/helpIndex.json")

androidComponents {
    onVariants(selector().all()) { variant ->
        def bundle = tasks.register("bundle${variant.name.capitalize()}HelpContent", HelpAssetsTask) {
            group = "build"
            description = "Copy docs/help + helpIndex.json into the ${variant.name} assets"
            docsDir.set(helpDocsDir)
            indexFile.set(helpIndexJson)
        }
        variant.sources.assets?.addGeneratedSourceDirectory(bundle) { it.outputDir }
    }
}

android {
    namespace 'website.msdnna.tessera'
    compileSdk 37

    defaultConfig {
        applicationId "website.msdnna.tessera"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        // Production server the app talks to by default. Overridable at
        // runtime (DataStore) from the login screen's advanced section so the
        // same APK can point at a dev/test backend.
        buildConfigField "String", "DEFAULT_BASE_URL", "\"https://tessera.msdnna.website\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The e2e harness (backend seeding, waits, drag gesture, screen mounting) is
    // shared verbatim by both tiers: the Robolectric specs in `src/test` and the
    // instrumented smoke specs in `src/androidTest`. One copy, not two — a second
    // harness would drift from the first and the tiers would stop testing the same
    // thing while still both being green.
    // Registered on the `kotlin` set, not on `java`: AGP's `java.srcDirs` no longer
    // feeds the Kotlin compilation, so a directory added there alone is listed by
    // the build and silently never compiled.
    sourceSets {
        getByName('test').kotlin.srcDir('src/e2eShared/java')
        getByName('androidTest').kotlin.srcDir('src/e2eShared/java')
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { t ->
                jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
                // The e2e tier needs a live backend on :8092, so it stays out of
                // the plain unit run (`make test-android`) and is opted into with
                // -Pe2e (`make test-e2e-android`).
                if (!project.hasProperty('e2e')) {
                    t.filter { excludeTestsMatching 'website.msdnna.tessera.e2e.*' }
                }
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE") ?: ""
            if (ks) {
                storeFile     file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias      System.getenv("ANDROID_KEY_ALIAS")         ?: ""
                keyPassword   System.getenv("ANDROID_KEY_PASSWORD")      ?: ""
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            enableUnitTestCoverage = true
        }
        release {
            // Use the production keystore when its env vars are set; otherwise
            // fall back to the debug keystore so an ad-hoc `assembleRelease`
            // doesn't require signing setup. `make android-release` enforces
            // the real keystore via tools/build-android-release.sh.
            def hasReleaseKs = (System.getenv("ANDROID_KEYSTORE_FILE") ?: "").trim() != ""
            signingConfig hasReleaseKs ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        freeCompilerArgs.addAll(
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
            '-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi'
        )
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.05.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // Material3 is used only as a thin scaffold (ripple, text selection, base
    // Surface). The visual language is our own design system in ui/theme.
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    // Chrome Custom Tabs — hosts the GitLab OAuth flow so the client never sees
    // the confidential-app secret; the backend hands the session back via a
    // tessera://oauth/callback deep link (see MainActivity).
    implementation 'androidx.browser:browser:1.8.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Firebase Cloud Messaging — background push while the app is closed. The
    // library is always linked (so the code compiles either way); it only does
    // anything once google-services.json supplies a project to talk to.
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'

    constraints {
        // firebase-messaging drags in play-services-basement, which still declares
        // androidx.fragment 1.1.0. Nothing here uses Fragment, but merely having a
        // pre-1.3.0 fragment on the classpath makes lint's
        // InvalidFragmentVersionForActivityResult fatal — and lintVitalRelease runs
        // inside assembleRelease, so `make android-release` fails while debug builds
        // and `make lint-android` stay green. A constraint raises the transitive
        // version without adding Fragment as a dependency of ours.
        implementation('androidx.fragment:fragment:1.8.9') {
            because 'pre-1.3.0 Fragment via play-services-basement breaks lintVitalRelease'
        }
    }

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'

    // ── Unit tests ──────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.14.11'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'app.cash.turbine:turbine:1.2.1'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.3.2'
    testImplementation 'com.google.truth:truth:1.4.5'
    // Compose UI testing on the JVM (Robolectric): drives the real composables
    // for the e2e tier. The BOM has to be repeated for the test configuration —
    // `implementation platform(...)` above does not carry over to testImplementation.
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // createComposeRule() needs an activity to host the composition; the test
    // manifest supplies it. It is a debug-only artifact, never in the release APK.
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ── Instrumented smoke tier (src/androidTest, needs a device/emulator) ───
    // Covers what the JVM tier cannot: the real render pipeline, real touch
    // dispatch and the real MainActivity. Same harness, same anchors.
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    // GrantPermissionRule — MainActivity asks for POST_NOTIFICATIONS on launch and
    // the system dialog would sit on top of the app, eating the spec's first taps.
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'com.google.truth:truth:1.4.5'
}

// ── JaCoCo (coverage) ────────────────────────────────────────────────────────
jacoco {
    toolVersion = "0.8.13"
}

def coverageExcludes = [
    '**/R.class',
    '**/R$*.class',
    '**/BuildConfig.*',
    '**/Manifest*.*',
    '**/*Test*.*',
    'android/**/*.*',
    '**/databinding/**',
    '**/*ComposableSingletons*',
    '**/*ComposableLambda*',
    '**/website/msdnna/tessera/ui/**',
    '**/website/msdnna/tessera/MainActivity*',
    '**/website/msdnna/tessera/data/api/**',
]

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Generate JaCoCo coverage report for debug unit tests'

    reports {
        xml.required.set(true)
        html.required.set(true)
    }

    def runtimeJar = zipTree(
        "$buildDir/intermediates/runtime_app_classes_jar/debug/bundleDebugClassesToRuntimeJar/classes.jar",
    ).matching { exclude coverageExcludes }
    classDirectories.setFrom(files(runtimeJar))
    sourceDirectories.setFrom(files(['src/main/java']))
    executionData.setFrom(fileTree(dir: buildDir, includes: ['**/*.exec']))
}

// ── ktlint (CLI via JavaExec; ktlint-gradle 13.x doesn't bind to AGP 9.2) ─────
configurations {
    ktlint
}

dependencies {
    ktlint("com.pinterest.ktlint:ktlint-cli:1.8.0") {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
    }
}

// Every Kotlin source root, listed by hand — a new source set does not join the
// lint automatically and would silently go unchecked.
def ktlintSources = files("src/main/java", "src/test/java", "src/androidTest/java", "src/e2eShared/java")

tasks.register("ktlintCheck", JavaExec) {
    group = "verification"
    description = "Run ktlint on all Kotlin sources"
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
    args(
        "**/src/main/java/**/*.kt",
        "**/src/test/java/**/*.kt",
        "**/src/androidTest/java/**/*.kt",
        "**/src/e2eShared/java/**/*.kt",
        "--reporter=plain",
        "--reporter=checkstyle,output=${layout.buildDirectory.get().asFile}/reports/ktlint/ktlint.xml"
    )
    inputs.files(ktlintSources)
    inputs.file("${rootProject.projectDir}/.editorconfig")
    outputs.file("${layout.buildDirectory.get().asFile}/reports/ktlint/ktlint.xml")
}

tasks.register("ktlintFormat", JavaExec) {
    group = "verification"
    description = "Run ktlint formatter (rewrites files in place)"
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
    args(
        "-F",
        "**/src/main/java/**/*.kt",
        "**/src/test/java/**/*.kt",
        "**/src/androidTest/java/**/*.kt",
        "**/src/e2eShared/java/**/*.kt"
    )
}

detekt {
    toolVersion = "1.23.8"
    config.setFrom(files("$projectDir/detekt.yml"))
    buildUponDefaultConfig = true
    autoCorrect = false
    parallel = true
    source.setFrom(files("src/main/java", "src/test/java", "src/androidTest/java", "src/e2eShared/java"))
}

/**
 * Copies the help centre's Markdown, screenshots and index into `<assets>/help`
 * (#2795). Declared as a typed task, not an ad-hoc Copy, because the variant API
 * hands it its own output directory — that is what carries the task dependency
 * into the asset merge.
 */
abstract class HelpAssetsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getDocsDir()

    /** The index the web build commits — one builder, one corpus, both clients. */
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getIndexFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void bundleHelp() {
        def docs = docsDir.get().asFile
        def index = indexFile.get().asFile
        // Under `help/`, so an article reaches its screenshots at the fixed
        // `file:///android_asset/help/assets/…` the renderer rewrites them to.
        def out = new File(outputDir.get().asFile, "help")
        fs.sync { spec ->
            spec.from(docs) { docSpec ->
                docSpec.include("**/*.md")
                docSpec.include("assets/**")
            }
            spec.from(index)
            spec.into(out)
        }
        // An index entry with no file behind it is a navigation row that opens a
        // blank page. The web suite checks this against docs/help; on this side
        // the copy is the only place that sees both lists at once.
        def parsed = new groovy.json.JsonSlurper().parse(new File(out, index.name))
        def missing = parsed.articles.findAll { a -> !new File(out, a.path as String).isFile() }*.path
        if (missing) {
            throw new GradleException("help: index lists articles with no file: ${missing}")
        }
    }
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "17"
    reports {
        html.required.set(true)
        xml.required.set(true)
        txt.required.set(false)
        sarif.required.set(false)
        md.required.set(false)
    }
}
