name: Release Android

on:
  push:
    tags:
      - 'android/v*'

permissions:
  contents: write   # create GitHub Release + upload APK

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches android/VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/android/v}"
          FILE="$(tr -d '[:space:]' < android/VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Git tag android/v$TAG does not match android/VERSION ($FILE). Bump android/VERSION or retag."
            exit 1
          fi
          echo "ANDROID_VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 (preview channel)
        run: |
          set -euo pipefail
          sdkmanager --install 'cmdline-tools;latest' >/dev/null
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses --channel=3 >/dev/null 2>&1 || true
          "$SDKMGR" --channel=3 'platforms;android-37.0'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Stub android/local.env (build-android-release.sh sources it)
        run: touch android/local.env

      - name: Lint + unit tests
        run: |
          make lint-android
          make test-android

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty. Configure it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          KS_PATH="$RUNNER_TEMP/keystore/tessera.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./tools/build-android-release.sh

      - name: Create GitHub Release (with APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android v${{ env.ANDROID_VERSION }}
          generate_release_notes: true
          files: android/msdnna-tessera-v${{ env.ANDROID_VERSION }}.apk
