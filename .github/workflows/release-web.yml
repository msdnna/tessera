name: Release Web

on:
  push:
    tags:
      - 'web/v*'

permissions:
  contents: write   # create GitHub Release
  packages: write   # push image to GHCR

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, publish frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches frontend/VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/web/v}"
          FILE="$(tr -d '[:space:]' < frontend/VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Git tag web/v$TAG does not match frontend/VERSION ($FILE). Bump frontend/VERSION or retag."
            exit 1
          fi
          echo "WEB_VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install + lint + test
        working-directory: frontend
        run: |
          corepack yarn install --immutable
          corepack yarn lint
          corepack yarn format:check
          corepack yarn test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tessera-frontend
          tags: |
            type=match,pattern=web/v(.*),group=1
            type=match,pattern=web/v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ env.WEB_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Build metadata for the sidebar version tooltip (vite bakes these into the
      # bundle; the ./frontend build context has no .git to read them from).
      - name: Build metadata
        id: bmeta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          # Repo root so the build reaches docs/help (help-centre articles, #2786).
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT=${{ steps.bmeta.outputs.commit }}
            BUILD_DATE=${{ steps.bmeta.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Web v${{ env.WEB_VERSION }}
          generate_release_notes: true
          make_latest: 'false'
