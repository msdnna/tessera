<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 12px 10px 14px;border-radius:16px;background:var(--v-pop);box-shadow:var(--v-sh-pop), 0 8px 32px color-mix(in srgb, var(--t-primary) 24%, transparent);font-family:var(--v-font);color:var(--t-text1);--t-surface:var(--v-pop)">
<div style="display:flex;align-items:center;gap:8px">
<span style="width:22px;height:22px;flex:0 0 22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--t-accent-grad)"><x-import component-from-global-scope="Tessera.Icon" name="SparklesOutline" size="13" color="#fff" hint-size="13px,13px"></x-import></span>
<sc-if value="{{ isNew }}" hint-placeholder-val="{{ true }}"><span style="height:20px;display:flex;align-items:center;padding:0 8px;border-radius:999px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 14%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 26%, var(--v-pop)));font-size:11.5px;font-weight:650;color:var(--t-text1)">Новое в v2</span></sc-if>
<sc-if value="{{ isCtx }}" hint-placeholder-val="{{ false }}"><span style="height:20px;display:flex;align-items:center;padding:0 8px;border-radius:999px;background:var(--v-pill);font-size:11.5px;font-weight:600;color:var(--t-text2)">Подсказка</span></sc-if>
<span style="flex:1"></span>
<sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">Esc</span></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:650;line-height:1.3">{{ title }}</span><span style="font-size:13px;line-height:1.45;color:var(--t-text2);text-wrap:pretty">{{ text }}</span></div>
<div style="display:flex;align-items:center;gap:8px;margin-top:2px">
<sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}"><span style="flex:1;font-size:12px;color:var(--t-text3)">{{ meta }}</span></sc-if>
<sc-if value="{{ bN }}" hint-placeholder-val="{{ true }}"><span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-radius:8px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 14%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 24%, var(--v-pop)));font-size:12.5px;font-weight:600;white-space:nowrap">Понятно<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">↵</span></span></sc-if>
<sc-if value="{{ bH }}" hint-placeholder-val="{{ false }}"><span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-radius:8px;background:var(--t-accent-grad);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px color-mix(in srgb, var(--t-primary) 30%, transparent)">Понятно<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600">↵</span></span></sc-if>
<sc-if value="{{ bF }}" hint-placeholder-val="{{ false }}"><span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-radius:8px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 14%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 24%, var(--v-pop)));font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 0 0 2px var(--v-pop), 0 0 0 4px color-mix(in srgb, var(--t-primary) 75%, transparent)">Понятно<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">↵</span></span></sc-if>
<sc-if value="{{ mob }}" hint-placeholder-val="{{ false }}"><span style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 14%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 24%, var(--v-pop)));font-size:14px;font-weight:600">Понятно</span></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:170},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;ctx&quot;],&quot;default&quot;:&quot;new&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Входящие&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Заметки и напоминания теперь в одной ленте — открывается отсюда или G I.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;st&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;focus&quot;,&quot;appear&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mob&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props; const st = p.st || 'normal'; const mob = p.mob === '1';
    return {
      title: p.title || '', text: p.text || '', meta: p.meta || '',
      isNew: (p.kind || 'new') === 'new', isCtx: p.kind === 'ctx',
      desk: !mob, mob,
      bN: !mob && (st === 'normal' || st === 'appear'), bH: !mob && st === 'hover', bF: !mob && st === 'focus',
     
    };
  }
}
</script>
</body>
</html>
