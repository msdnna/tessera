<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="position:relative;width:100%;height:100%;pointer-events:none;font-family:var(--v-font);color:var(--t-text1)">
<sc-if value="{{ v_a1 }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:16px;top:60px;width:360px;display:flex;flex-direction:column;gap:8px"><dc-import name="Toast" k="assigned" hint-size="360px,84px"></dc-import><dc-import name="Toast" k="actB5" hint-size="360px,44px"></dc-import></div><div style="position:absolute;left:288px;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:420px"><dc-import name="Toast" k="err" hint-size="420px,90px"></dc-import></div><dc-import name="UndoToast" text="Тег «release» удалён" hint-size="400px,50px"></dc-import></div></sc-if>
<sc-if value="{{ v_b1 }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:288px;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:420px"><dc-import name="Toast" k="assigned" hint-size="420px,84px"></dc-import></div><div style="width:420px"><dc-import name="Toast" k="actB5" hint-size="420px,44px"></dc-import></div><div style="width:420px"><dc-import name="Toast" k="err" hint-size="420px,90px"></dc-import></div><dc-import name="UndoToast" text="Тег «release» удалён" hint-size="400px,50px"></dc-import></div></sc-if>
<sc-if value="{{ v_pulse }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:904px;top:296px;width:240px;height:118px;border-radius:14px;box-shadow:0 0 0 2px var(--t-primary), 0 0 0 7px color-mix(in srgb, var(--t-primary) 20%, transparent), 0 0 28px color-mix(in srgb, var(--t-primary) 40%, transparent)"></div><div style="position:absolute;right:16px;top:60px;width:360px"><dc-import name="Toast" k="act" hint-size="360px,44px"></dc-import></div></sc-if>
<sc-if value="{{ v_deck }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:16px;top:60px;width:360px;display:flex;flex-direction:column;gap:8px"><div style="position:relative;padding-bottom:16px"><div style="position:absolute;left:0;right:0;bottom:0;height:60px;border-radius:14px;background:var(--v-pop);box-shadow:var(--v-sh-pop);transform:scale(.92);transform-origin:50% 100%;opacity:.7"></div><div style="position:absolute;left:0;right:0;bottom:8px;height:60px;border-radius:14px;background:var(--v-pop);box-shadow:var(--v-sh-pop);transform:scale(.96);transform-origin:50% 100%;opacity:.88"></div><div style="position:relative"><dc-import name="Toast" k="mention" hint-size="360px,84px"></dc-import></div></div><dc-import name="Toast" k="more" hint-size="360px,36px"></dc-import></div></sc-if>
<sc-if value="{{ v_deckOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:16px;top:60px;width:360px;display:flex;flex-direction:column;gap:8px"><dc-import name="Toast" k="mention" st="hover" hint-size="360px,120px"></dc-import><dc-import name="Toast" k="comment" st="hover" p="44" hint-size="360px,120px"></dc-import><dc-import name="Toast" k="assigned" st="hover" p="30" hint-size="360px,120px"></dc-import><dc-import name="Toast" k="more" hint-size="360px,36px"></dc-import></div></sc-if>
<sc-if value="{{ v_away }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:16px;top:60px;width:360px"><dc-import name="Toast" k="away" hint-size="360px,100px"></dc-import></div></sc-if>
<sc-if value="{{ v_update }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:16px;top:60px;width:360px"><dc-import name="Toast" k="update" hint-size="360px,100px"></dc-import></div></sc-if>
<sc-if value="{{ v_chip }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:1092px;top:11px;height:30px;display:flex;align-items:center;gap:6px;padding:0 10px 0 9px;border-radius:8px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 14%, var(--v-board)), color-mix(in srgb, var(--t-primary) 26%, var(--v-board)));font-size:13px;font-weight:600;white-space:nowrap"><x-import component-from-global-scope="Tessera.Icon" name="CloudDownloadOutline" size="15" color="var(--t-primary)" hint-size="15px,15px"></x-import>Обновить</div><div style="position:absolute;left:1040px;top:50px;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:10px;background:var(--v-pop);box-shadow:var(--v-sh-pop);font-size:12px;color:var(--t-text2);white-space:nowrap;padding-right:10px">Вышла версия 0.190 · клик обновляет страницу</div></sc-if>
<sc-if value="{{ v_dndMenu }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:899px;top:50px;width:420px"><dc-import name="NotifPop" dnd="menu" hint-size="420px,640px"></dc-import></div><div style="position:absolute;left:1027px;top:94px;width:248px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:var(--v-pop);box-shadow:var(--v-sh-drag);font-size:13px"><div style="padding:6px 8px 4px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t-text3)">Не беспокоить</div><div style="height:32px;display:flex;align-items:center;gap:9px;padding:0 6px 0 8px;border-radius:7px;background:var(--v-hover)"><x-import component-from-global-scope="Tessera.Icon" name="TimeOutline" size="15" color="var(--t-text3)" hint-size="15px,15px"></x-import><span style="flex:1">На 1 час</span><span style="color:var(--t-text3);font-size:12px">до 11:42</span><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600">1</span></div><div style="height:32px;display:flex;align-items:center;gap:9px;padding:0 6px 0 8px;border-radius:7px"><x-import component-from-global-scope="Tessera.Icon" name="MoonOutline" size="15" color="var(--t-text3)" hint-size="15px,15px"></x-import><span style="flex:1">До завтра, 9:00</span><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600">2</span></div><div style="margin:4px 2px 2px;padding:8px 8px;border-radius:10px;background:var(--v-sub);font-size:12px;line-height:1.45;color:var(--t-text3)">Упоминания, напоминания и звонки проходят — это меняется в Настройках → Уведомления.</div></div></sc-if>
<sc-if value="{{ v_dndOn }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:1285px;top:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--v-active);color:var(--t-primary)"><x-import component-from-global-scope="Tessera.Icon" name="NotificationsOutline" size="18" hint-size="18px,18px"></x-import><span style="position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--v-pop);box-shadow:0 0 0 1.5px var(--v-board)"><x-import component-from-global-scope="Tessera.Icon" name="MoonOutline" size="9" color="var(--t-primary)" hint-size="9px,9px"></x-import></span></div><div style="position:absolute;left:899px;top:50px;width:420px"><dc-import name="NotifPop" dnd="on" hint-size="420px,700px"></dc-import></div></sc-if>
<sc-if value="{{ v_mobile }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:12px;right:12px;bottom:96px;display:flex;flex-direction:column;align-items:stretch;gap:12px">
<div style="align-self:flex-end;margin-right:4px;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--t-accent-grad);box-shadow:0 10px 24px color-mix(in srgb, var(--t-primary) 38%, transparent), var(--v-sh-pop)"><x-import component-from-global-scope="Tessera.Icon" name="AddOutline" size="28" color="#fff" hint-size="28px,28px"></x-import></div>
<sc-if value="{{ qOn }}" hint-placeholder-val="{{ false }}"><div style="align-self:center;height:22px;display:flex;align-items:center;gap:6px;padding:0 9px;margin-bottom:-4px;border-radius:999px;background:var(--v-pop);box-shadow:var(--v-sh-card);font-size:11.5px;color:var(--t-text2)"><span style="display:flex;gap:4px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="3"><sc-if value="{{ d.on }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--t-accent-grad)"></span></sc-if><sc-if value="{{ d.off }}" hint-placeholder-val="{{ true }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--t-text3);opacity:.45"></span></sc-if></sc-for></span>{{ qText }}</div></sc-if>
<sc-if value="{{ m_plain }}" hint-placeholder-val="{{ true }}"><dc-import name="Toast" k="{{ mk }}" touch="{{ yes }}" hint-size="366px,90px"></dc-import></sc-if>
<sc-if value="{{ m_swipe }}" hint-placeholder-val="{{ false }}"><div style="position:relative"><div style="position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:flex-start;padding-left:18px;gap:8px;font-size:13px;color:var(--t-text3)"><x-import component-from-global-scope="Tessera.Icon" name="CloseCircleOutline" size="18" hint-size="18px,18px"></x-import>Закрыть</div><div style="transform:translateX(132px);opacity:.62"><dc-import name="Toast" k="assigned" touch="{{ yes }}" hint-size="366px,90px"></dc-import></div></div></sc-if>
</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;v&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;a1&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MK = { mMe: 'assigned', mMeL: 'assigned', mUndo: 'undoT', mErr: 'err', mBatch: 'actB5', mQueue: 'assigned', mSwipe1: 'assigned', mSwipe2: 'comment' };
class Component extends DCLogic {
  renderVals() {
    const v = this.props.v || '';
    const out = { yes: true };
    ['a1', 'b1', 'pulse', 'deck', 'deckOpen', 'away', 'update', 'chip', 'dndMenu', 'dndOn'].forEach((k) => { out['v_' + k] = v === k; });
    const mob = v in MK;
    const q = v === 'mQueue' || v === 'mSwipe1' ? 1 : v === 'mSwipe2' ? 2 : 0;
    Object.assign(out, {
      v_mobile: mob, mk: MK[v] || 'assigned', m_swipe: v === 'mSwipe1', m_plain: mob && v !== 'mSwipe1',
      qOn: q > 0, qText: q + ' из 3', dots: [1, 2, 3].map((i) => ({ on: i === q, off: i !== q })),
    });
    return out;
  }
}
</script>
</body>
</html>
