<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;height:50px;box-sizing:border-box;padding:0 8px 0 10px;border-radius:14px;background:var(--v-pop);box-shadow:var(--v-sh-drag);font-family:var(--v-font);color:var(--t-text1);white-space:nowrap;width:max-content;--t-surface:var(--v-pop)" onMouseEnter="{{ hIn }}" onMouseLeave="{{ hOut }}">
<sc-if value="{{ iTrash }}" hint-placeholder-val="{{ true }}"><span style="width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--v-pill);color:var(--t-text2)"><x-import component-from-global-scope="Tessera.Icon" name="{{ icon }}" size="16" hint-size="16px,16px"></x-import></span></sc-if>
<sc-if value="{{ iOk }}" hint-placeholder-val="{{ false }}"><span style="width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top right, color-mix(in srgb, #18a058 16%, var(--v-pop)), color-mix(in srgb, #18a058 28%, var(--v-pop)));color:#18a058"><x-import component-from-global-scope="Tessera.Icon" name="CheckmarkOutline" size="16" hint-size="16px,16px"></x-import></span></sc-if>
<sc-if value="{{ iErr }}" hint-placeholder-val="{{ false }}"><span style="width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top right, color-mix(in srgb, #e0533d 16%, var(--v-pop)), color-mix(in srgb, #e0533d 28%, var(--v-pop)));color:#e0533d"><x-import component-from-global-scope="Tessera.Icon" name="AlertCircleOutline" size="16" hint-size="16px,16px"></x-import></span></sc-if>
<span style="font-size:13.5px;padding-right:4px">{{ text }}</span>
<sc-if value="{{ bUndo }}" hint-placeholder-val="{{ true }}"><div style="height:32px;display:flex;align-items:center;gap:8px;padding:0 5px 0 11px;border-radius:9px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 16%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 26%, var(--v-pop)));font-size:13px;font-weight:600;cursor:pointer" style-hover="background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 24%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 36%, var(--v-pop)))">{{ action }}<span style="display:flex;gap:3px"><sc-for list="{{ keys }}" as="k" hint-placeholder-count="2"><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">{{ k }}</span></sc-for></span></div></sc-if>
<sc-if value="{{ bFocus }}" hint-placeholder-val="{{ false }}"><div style="height:32px;display:flex;align-items:center;gap:8px;padding:0 5px 0 11px;border-radius:9px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 16%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 26%, var(--v-pop)));font-size:13px;font-weight:600;outline:2px solid var(--t-primary);outline-offset:2px">{{ action }}<span style="display:flex;gap:3px"><sc-for list="{{ keys }}" as="k" hint-placeholder-count="2"><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">{{ k }}</span></sc-for></span></div></sc-if>
<sc-if value="{{ bLoad }}" hint-placeholder-val="{{ false }}"><div style="height:32px;display:flex;align-items:center;gap:8px;padding:0 11px;border-radius:9px;font-size:13px;color:var(--t-text2)"><span style="width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--t-primary) 0 28%, color-mix(in srgb, var(--t-primary) 22%, transparent) 28%);-webkit-mask:radial-gradient(circle, transparent 5px, #000 5.5px);mask:radial-gradient(circle, transparent 5px, #000 5.5px)"></span>Отменяем…</div></sc-if>
<div title="Закрыть" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--t-text3);cursor:pointer" style-hover="background:var(--v-hover);color:var(--t-text1)"><x-import component-from-global-scope="Tessera.Icon" name="CloseOutline" size="16" hint-size="16px,16px"></x-import></div>
{{ barEl }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:80},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;progress&quot;,&quot;hover&quot;,&quot;kfocus&quot;,&quot;loading&quot;,&quot;undone&quot;,&quot;error&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;live&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Доска «Бэклог продукта» удалена&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { t: 0, hover: false };
  componentDidMount() {
    if (!this.props.live) return;
    this.iv = setInterval(() => { if (!this.state.hover) this.setState((s) => ({ t: (s.t + 0.1) % 8.6 })); }, 100);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const st = this.props.state || 'normal';
    const DUR = 7;
    let p = this.props.p ?? (st === 'normal' ? 100 : st === 'hover' ? 58 : st === 'kfocus' ? 72 : 40);
    if (this.props.live) p = Math.max(0, 100 - (this.state.t / DUR) * 100);
    const paused = st === 'hover' || (this.props.live && this.state.hover);
    const done = st === 'undone', err = st === 'error', load = st === 'loading';
    return {
      icon: this.props.icon || 'TrashOutline',
      text: done ? (this.props.doneText || 'Доска «Бэклог продукта» восстановлена') : err ? 'Не удалось восстановить доску' : (this.props.text || 'Доска «Бэклог продукта» удалена'),
      action: err ? 'Повторить' : 'Отменить', keys: err ? ['↵'] : ['⌘', 'Z'],
      iTrash: !done && !err, iOk: done, iErr: err,
      bUndo: !done && !load && st !== 'kfocus', bFocus: st === 'kfocus', bLoad: load,
      bar: !done && !err && !load && !paused, barPaused: paused && !done && !err,
      barEl: (!done && !err && !load) ? React.createElement('div', { style: { position: 'absolute', left: 0, bottom: 0, height: 3, width: p.toFixed(1) + '%', borderRadius: '0 2px 2px 0', background: paused ? 'var(--t-text3)' : 'var(--t-accent-grad)', opacity: paused ? 0.6 : 1 } }) : null,
      hIn: () => this.setState({ hover: true }), hOut: () => this.setState({ hover: false }),
    };
  }
}
</script>
</body>
</html>
