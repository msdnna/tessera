<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:12px;padding:14px 16px 12px;border-radius:16px;background:var(--v-pop);box-shadow:var(--v-sh-pop), 0 10px 40px color-mix(in srgb, var(--t-primary) 26%, transparent);font-family:var(--v-font);color:var(--t-text1);--t-surface:var(--v-pop)">
<div style="display:flex;align-items:flex-start;gap:10px">
<sc-if value="{{ tileSpark }}" hint-placeholder-val="{{ true }}"><span style="width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--t-accent-grad);box-shadow:0 2px 8px color-mix(in srgb, var(--t-primary) 35%, transparent)"><x-import component-from-global-scope="Tessera.Icon" name="SparklesOutline" size="15" color="#fff" hint-size="15px,15px"></x-import></span></sc-if>
<sc-if value="{{ tileOk }}" hint-placeholder-val="{{ false }}"><span style="width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top right, color-mix(in srgb, #18a058 86%, #000), #18a058 50%, color-mix(in srgb, #18a058 86%, #fff))"><x-import component-from-global-scope="Tessera.Icon" name="CheckmarkOutline" size="16" color="#fff" hint-size="16px,16px"></x-import></span></sc-if>
<sc-if value="{{ tileWarn }}" hint-placeholder-val="{{ false }}"><span style="width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top right, color-mix(in srgb, #f0a020 86%, #000), #f0a020 50%, color-mix(in srgb, #f0a020 86%, #fff))"><x-import component-from-global-scope="Tessera.Icon" name="EyeOffOutline" size="15" color="#fff" hint-size="15px,15px"></x-import></span></sc-if>
<sc-if value="{{ tilePause }}" hint-placeholder-val="{{ false }}"><span style="width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--v-pill);color:var(--t-text2)"><x-import component-from-global-scope="Tessera.Icon" name="PauseOutline" size="15" hint-size="15px,15px"></x-import></span></sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:650;line-height:1.3;text-wrap:pretty">{{ title }}</span><span style="font-size:12px;color:var(--t-text3);font-variant-numeric:tabular-nums">{{ chapLine }}</span></div>
<sc-if value="{{ fConf }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t-text3);white-space:nowrap">к шагу<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">Esc</span></span></sc-if>
</div>
<sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}"><div style="font-size:13.5px;line-height:1.5;color:var(--t-text2);text-wrap:pretty">{{ text }}</div></sc-if>
<sc-if value="{{ pWait }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 9%, var(--v-pop)), color-mix(in srgb, var(--t-primary) 17%, var(--v-pop)));font-size:12.5px;line-height:1.4;color:var(--t-text1)"><span style="width:8px;height:8px;flex:0 0 8px;border-radius:4px;background:var(--t-accent-grad);box-shadow:0 0 0 4px color-mix(in srgb, var(--t-primary) 22%, transparent)"></span><span style="flex:1">{{ wait }}</span></div></sc-if>
<sc-if value="{{ pDone }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:linear-gradient(to top right, color-mix(in srgb, #18a058 11%, var(--v-pop)), color-mix(in srgb, #18a058 19%, var(--v-pop)));font-size:12.5px;font-weight:600;color:#18a058"><x-import component-from-global-scope="Tessera.Icon" name="CheckmarkCircleOutline" size="15" color="#18a058" hint-size="15px,15px"></x-import><span style="flex:1">Засчитано · следующий шаг</span></div></sc-if>
<sc-if value="{{ pMiss }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:linear-gradient(to top right, color-mix(in srgb, #f0a020 10%, var(--v-pop)), color-mix(in srgb, #f0a020 18%, var(--v-pop)));font-size:12.5px;line-height:1.4;color:var(--t-text1)"><span style="flex:1">{{ wait }}</span><span style="font-size:12px;font-weight:600;color:#f0a020;font-variant-numeric:tabular-nums">5 с</span></div></sc-if>
<sc-if value="{{ pLoad }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--v-sub);font-size:12.5px;color:var(--t-text2)"><span style="width:12px;height:12px;flex:0 0 12px;box-sizing:border-box;border-radius:50%;border:2px solid var(--v-pill);border-top-color:var(--t-primary)"></span><span style="flex:1">{{ wait }}</span></div></sc-if>
<sc-if value="{{ hasSegs }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:3px"><sc-for list="{{ segsOn }}" as="s" hint-placeholder-count="4"><span style="flex:1;height:3px;border-radius:2px;background:var(--t-accent-grad)"></span></sc-for><sc-for list="{{ segsOff }}" as="s" hint-placeholder-count="6"><span style="flex:1;height:3px;border-radius:2px;background:color-mix(in srgb, var(--t-text3) 28%, transparent)"></span></sc-for></div></sc-if>
<div style="display:flex;align-items:center;gap:6px">
<sc-if value="{{ abort }}" hint-placeholder-val="{{ true }}"><span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;margin-left:-8px;border-radius:8px;font-size:12.5px;color:var(--t-text3);white-space:nowrap">Прервать<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">Esc</span></span></sc-if>
<sc-if value="{{ fConf }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;padding:0 10px;margin-left:-4px;border-radius:9px;background:var(--v-ctl);font-size:13px;color:var(--t-text1);white-space:nowrap">Завершить обучение</span></sc-if>
<span style="flex:1"></span>
<sc-if value="{{ backN }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;gap:6px;padding:0 5px 0 9px;border-radius:9px;font-size:13px;color:var(--t-text2);white-space:nowrap">Назад<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">←</span></span></sc-if>
<sc-if value="{{ backH }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;gap:6px;padding:0 5px 0 9px;border-radius:9px;background:color-mix(in srgb, var(--t-text1) 9%, transparent);font-size:13px;color:var(--t-text1);white-space:nowrap">Назад<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:var(--v-kbd);color:var(--t-text2);font-size:11px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.22)">←</span></span></sc-if>
<sc-if value="{{ fMiss }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;padding:0 10px;border-radius:9px;background:var(--v-ctl);font-size:13px;color:var(--t-text1);white-space:nowrap">Пропустить шаг</span></sc-if>
<sc-if value="{{ fFin }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;padding:0 10px;border-radius:9px;background:var(--v-ctl);font-size:13px;color:var(--t-text1);white-space:nowrap">К чек-листу</span></sc-if>
<sc-if value="{{ priN }}" hint-placeholder-val="{{ true }}"><span style="height:30px;display:flex;align-items:center;gap:7px;padding:0 5px 0 12px;border-radius:9px;background:var(--t-accent-grad);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px color-mix(in srgb, var(--t-primary) 30%, transparent)">{{ priLabel }}<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600">↵</span></span></sc-if>
<sc-if value="{{ priF }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;gap:7px;padding:0 5px 0 12px;border-radius:9px;background:var(--t-accent-grad);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 0 0 2px var(--v-pop), 0 0 0 4px color-mix(in srgb, var(--t-primary) 75%, transparent)">{{ priLabel }}<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600">↵</span></span></sc-if>
<sc-if value="{{ priD }}" hint-placeholder-val="{{ false }}"><span style="height:30px;display:flex;align-items:center;gap:7px;padding:0 5px 0 12px;border-radius:9px;background:var(--t-accent-grad);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;opacity:.42">{{ priLabel }}<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:5px;background:rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600">↵</span></span></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:240},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Назовите проект&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chap&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Основы&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;of&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;10&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;info&quot;,&quot;action&quot;,&quot;done&quot;,&quot;missing&quot;,&quot;loading&quot;,&quot;confirm&quot;,&quot;final&quot;],&quot;default&quot;:&quot;info&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;st&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;focus&quot;,&quot;disabled&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wait&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props; const k = p.kind || 'info'; const st = p.st || 'normal';
    const n = +(p.n || 1), of = +(p.of || 0);
    const on = Math.min(n, of); const segsOn = Array.from({ length: on }, (_, i) => ({ key: 'a' + i })); const segsOff = Array.from({ length: Math.max(0, of - on) }, (_, i) => ({ key: 'b' + i }));
    const hasPri = k === 'info' || k === 'confirm' || k === 'final';
    const back = k === 'info' && p.back === '1';
    return {
      title: p.title || '', text: p.text || '', wait: p.wait || '',
      chapLine: p.chap ? (of ? p.chap + ' · ' + n + ' из ' + of : p.chap) : '',
      tileSpark: k === 'info' || k === 'action' || k === 'loading', tileOk: k === 'done' || k === 'final', tileWarn: k === 'missing', tilePause: k === 'confirm',
      hasText: !!p.text, pWait: k === 'action', pDone: k === 'done', pMiss: k === 'missing', pLoad: k === 'loading',
      segsOn, segsOff, hasSegs: of > 0 && k !== 'confirm',
      abort: k !== 'confirm' && k !== 'final', fConf: k === 'confirm', fMiss: k === 'missing', fFin: k === 'final',
      backN: back && st !== 'hover', backH: back && st === 'hover',
      priLabel: k === 'confirm' ? 'Продолжить позже' : k === 'final' ? 'Готово' : 'Понятно',
      priN: hasPri && st !== 'focus' && st !== 'disabled', priF: hasPri && st === 'focus', priD: hasPri && st === 'disabled',
    };
  }
}
</script>
</body>
</html>
