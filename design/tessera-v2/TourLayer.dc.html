<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;step&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;b03&quot;,&quot;b05&quot;,&quot;x01&quot;,&quot;b06&quot;,&quot;i01&quot;,&quot;s02&quot;,&quot;g01&quot;,&quot;m01&quot;,&quot;wn&quot;,&quot;sp1&quot;,&quot;sp1h&quot;,&quot;sp2&quot;,&quot;sp3&quot;,&quot;mt&quot;,&quot;ms&quot;],&quot;default&quot;:&quot;b03&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TD = {
  b03: { c: [[282, 242, 348, 413]], a: [[[724, 330], [622, 353]], [[724, 400], [622, 428]]] },
  b05: { c: [[361, 104, 254, 790]], a: [[[646, 700], [614, 858]]] },
  x01: { c: [[361, 104, 254, 790]], a: [] },
  b06: { c: [[367, 147, 246, 146]], a: [[[384, 318], [381, 246], [336, 290]], [[452, 318], [450, 258], [476, 292]], [[414, 318], [404, 286], [426, 304]], [[640, 318], [594, 286], [640, 292]]] },
  i01: { c: [[1220, 9, 57, 34], [1040, 54, 394, 836]], a: [[[1012, 116], [1214, 30], [1120, 34]], [[1012, 196], [1050, 160]]] },
  s02: { c: [[304, 102, 1120, 194]], a: [[[560, 332], [520, 304]]] },
  g01: { c: [[64, 92, 216, 32]], a: [[[400, 262], [288, 112], [330, 150]]] },
  m01: { c: [[1220, 9, 57, 34]], a: [[[1176, 86], [1244, 50]]] },
  wn: { c: [], a: [] },
  sp1: { ns: 1, h: [[1220, 9, 57, 34]], a: [[[1206, 76], [1248, 50]]] },
  sp1h: { ns: 1, h: [[1220, 9, 57, 34]], a: [[[1206, 76], [1248, 50]]] },
  sp2: { ns: 1, h: [[1017, 58, 216, 34]], a: [[[1110, 176], [1128, 98], [1080, 140]]] },
  sp3: { ns: 1, h: [[304, 102, 1120, 40]], a: [[[520, 190], [480, 148]]] },
  mt: { w: 390, h0: 844, c: [[20, 188, 318, 112]], a: [] },
  ms: { w: 390, h0: 844, ns: 1, h: [[157, 760, 76, 64]], a: [] },
};
class Component extends DCLogic {
  uid = 't' + Math.random().toString(36).slice(2, 8);
  renderVals() {
    const st = this.props.step || 'b03';
    const d = TD[st] || { c: [], a: [] };
    const W = d.w || 1440, H = d.h0 || 900;
    const h = React.createElement; const u = this.uid;
    const pad = (r, p, rx) => ({ x: r[0] - p, y: r[1] - p, width: r[2] + 2 * p, height: r[3] + 2 * p, rx });
    const arrows = (d.a || []).map((a, i) => {
      const [p, q, c0] = a; const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; const dx = q[0] - p[0], dy = q[1] - p[1];
      const len = Math.hypot(dx, dy) || 1; const bend = Math.min(60, len * 0.35) * (i % 2 ? -1 : 1);
      const cx = c0 ? c0[0] : mx - dy / len * bend, cy = c0 ? c0[1] : my + dx / len * bend;
      const ang = Math.atan2(q[1] - cy, q[0] - cx); const L = 9, Wd = 5.5;
      const hx = q[0] - Math.cos(ang) * L, hy = q[1] - Math.sin(ang) * L;
      const head = [q[0] + ',' + q[1], (hx - Math.sin(ang) * Wd) + ',' + (hy + Math.cos(ang) * Wd), (hx + Math.sin(ang) * Wd) + ',' + (hy - Math.cos(ang) * Wd)].join(' ');
      return h('g', { key: 'a' + i },
        h('linearGradient', { id: u + 'g' + i, gradientUnits: 'userSpaceOnUse', x1: p[0], y1: p[1], x2: q[0], y2: q[1] },
          h('stop', { offset: 0, style: { stopColor: 'color-mix(in srgb, var(--t-primary) 80%, #000)' } }),
          h('stop', { offset: 1, style: { stopColor: 'color-mix(in srgb, var(--t-primary) 72%, #fff)' } })),
        h('path', { d: 'M' + p[0] + ' ' + p[1] + ' Q' + cx + ' ' + cy + ' ' + hx + ' ' + hy, style: { fill: 'none', stroke: 'url(#' + u + 'g' + i + ')', strokeWidth: 2.25, strokeLinecap: 'round' } }),
        h('polygon', { points: head, style: { fill: 'color-mix(in srgb, var(--t-primary) 72%, #fff)' } }));
    });
    const cuts = d.c || [];
    const halos = (d.h || []).map((r, i) => h('g', { key: 'h' + i },
      h('rect', Object.assign(pad(r, 6, 12), { style: { fill: 'none', stroke: 'color-mix(in srgb, var(--t-primary) 16%, transparent)', strokeWidth: 8 } })),
      h('rect', Object.assign(pad(r, 3, 10), { style: { fill: 'color-mix(in srgb, var(--t-primary) 8%, transparent)', stroke: 'color-mix(in srgb, var(--t-primary) 62%, transparent)', strokeWidth: 2 } }))));
    const scrim = d.ns ? null : [
      h('defs', { key: 'd' }, h('mask', { id: u + 'm' }, h('rect', { x: 0, y: 0, width: W, height: H, style: { fill: '#fff' } }), cuts.map((r, i) => h('rect', Object.assign({ key: i }, pad(r, 6, 10), { style: { fill: '#000' } }))))),
      h('rect', { key: 's', x: 0, y: 0, width: W, height: H, mask: 'url(#' + u + 'm)', style: { fill: 'var(--v-scrim)' } }),
      cuts.map((r, i) => h('rect', Object.assign({ key: 'r' + i }, pad(r, 6, 10), { style: { fill: 'none', stroke: 'color-mix(in srgb, var(--t-primary) 55%, transparent)', strokeWidth: 1.5 } }))),
    ];

    const out = { svg };
    Object.keys(TD).forEach((k) => { out['s_' + k] = st === k; });
    return out;
  }
}
