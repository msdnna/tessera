<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="position:relative;width:390px;height:844px;display:flex;flex-direction:column;background:var(--v-backdrop);color:var(--t-text1);font-family:var(--v-font);font-size:13px;overflow:hidden">
<div style="height:44px;flex:0 0 44px;display:flex;align-items:center;padding:0 28px;font-size:15px;font-weight:600;background:var(--v-topbar)">9:41</div>
<div style="height:48px;flex:0 0 48px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--v-topbar)">
<div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--t-text2)"><x-import component-from-global-scope="Tessera.Icon" name="MenuOutline" size="22" hint-size="22px,22px"></x-import></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.2"><span style="font-size:11.5px;color:var(--t-text3)">Tessera Web</span><span style="display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600">Спринт 0.150<x-import component-from-global-scope="Tessera.Icon" name="ChevronDownOutline" size="12" color="var(--t-text3)" hint-size="12px,12px"></x-import></span></div>
<div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--t-text2)"><x-import component-from-global-scope="Tessera.Icon" name="SearchOutline" size="20" hint-size="20px,20px"></x-import></div>
<div style="position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--t-text2)"><x-import component-from-global-scope="Tessera.Icon" name="NotificationsOutline" size="20" hint-size="20px,20px"></x-import><span style="position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:4px;background:var(--t-accent-grad)"></span></div>
</div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;margin:var(--v-m-inset);background:var(--v-board);border-radius:var(--v-m-r);overflow:hidden">
<div style="display:flex;align-items:center;gap:6px;padding:10px 12px 8px;overflow:hidden;flex:0 0 auto">
<span style="flex:0 0 auto;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--v-r-ctl);background:var(--v-ctl);font-size:13px;font-weight:600"><span class="grad-icon" style="display:flex"><x-import component-from-global-scope="Tessera.TesseraIcon" name="layout-kanban" size="15" hint-size="15px,15px"></x-import></span>Канбан<x-import component-from-global-scope="Tessera.Icon" name="ChevronDownOutline" size="12" color="var(--t-text3)" hint-size="12px,12px"></x-import></span>
<span style="flex:0 0 auto;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--v-r-ctl);background:linear-gradient(to top right, color-mix(in srgb, var(--t-primary) 14%, var(--v-ctl)), color-mix(in srgb, var(--t-primary) 24%, var(--v-ctl)));font-size:13px;font-weight:600"><x-import component-from-global-scope="Tessera.Icon" name="FunnelOutline" size="14" color="var(--t-text2)" hint-size="14px,14px"></x-import>Фильтр · 2</span>
<span style="flex:0 0 auto;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--v-r-ctl);background:var(--v-ctl);font-size:13px;white-space:nowrap"><x-import component-from-global-scope="Tessera.Icon" name="LayersOutline" size="14" color="var(--t-text3)" hint-size="14px,14px"></x-import><span style="font-weight:600">Статус</span></span>
<span style="flex:0 0 auto;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--v-r-ctl);background:var(--v-ctl);font-size:13px;color:var(--t-text2);white-space:nowrap"><x-import component-from-global-scope="Tessera.Icon" name="OptionsOutline" size="14" color="var(--t-text3)" hint-size="14px,14px"></x-import>Вид</span>
</div>
<sc-if value="{{ strip }}" hint-placeholder-val="{{ false }}"><div style="padding:0 12px 6px;flex:0 0 auto"><dc-import name="StageStrip" compact="{{ strip }}" hint-size="366px,40px"></dc-import></div></sc-if>
<div style="flex:1;min-height:0;display:flex;align-items:flex-start;gap:8px;padding:4px 12px 16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0 12px;scrollbar-width:none;--cw:350px">
<sc-for list="{{ cols }}" as="c" hint-placeholder-count="2"><div style="flex:0 0 auto;scroll-snap-align:start"><dc-import name="Column" c="{{ c }}" dir="{{ dir }}" hint-size="350px,500px"></dc-import></div></sc-for>
</div>
</div>
<sc-if value="{{ final }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:18px;bottom:44px;z-index:20;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--t-accent-grad);box-shadow:0 10px 24px color-mix(in srgb, var(--t-primary) 38%, transparent), var(--v-sh-pop)"><x-import component-from-global-scope="Tessera.Icon" name="AddOutline" size="28" color="#fff" hint-size="28px,28px"></x-import></div></sc-if>
<div style="height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;background:var(--v-backdrop)"><span style="width:134px;height:5px;border-radius:3px;background:var(--t-text1);opacity:.35"></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { dir: this.props.dir || 'A', cols: this.props.cols || [], final: !!this.props.final, strip: !!this.props.strip };
  }
}
</script>
</body>
</html>
