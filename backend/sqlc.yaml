version: "2"
sql:
  - engine: "postgresql"
    # Only the *.up.sql files describe the live schema; down files would DROP.
    schema: "migrations/*.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # Recurrence is raw JSON: as *json.RawMessage it round-trips through pgx
          # and serialises as real JSON in task responses (not base64 like []byte).
          - column: "tasks.recurrence"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          # Estimation config is raw JSON too (same round-trip as recurrence).
          - column: "workspaces.estimation"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - column: "projects.estimation"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          # Notification payload is raw JSON as well: the feed rows are returned
          # to the client as-is, and []byte would arrive base64-encoded.
          - column: "notifications.payload"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
